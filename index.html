<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Web Quiz</h1>

    <div class="scoreboard">
      <span>Score <b id="score">0</b></span>
      <span>Best <b id="best">-</b></span>
    </div>

    <section id="quiz">
      <p id="progress" class="progress-text"></p>
      <div class="bar"><div id="bar-fill"></div></div>
      <h2 id="question"></h2>
      <div id="answers" class="answers"></div>
      <p id="feedback" class="feedback"></p>
      <button id="next" class="main-btn" hidden>Next</button>
    </section>

    <section id="result" hidden>
      <p class="big" id="result-score"></p>
      <p id="result-text" class="feedback"></p>
      <button id="restart" class="main-btn">Play again</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
